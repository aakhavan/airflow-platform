# Registry of projects (docs/spec.md §6). Paths are relative to this file, with forward slashes.
projects:
  - name: examples
    dags: {local: ../dags/examples}
    # S4 live check: a page that exists (the API docs). S5 replaces this with governor's entry.
    view: {label: Examples, url: "http://localhost:8080/docs"}
    task_link: {label: "Open docs", url_template: "http://localhost:8080/docs?run_id={run_id}", dag_prefix: "hello_"}

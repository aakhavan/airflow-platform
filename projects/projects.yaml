# Registry of projects (docs/spec.md §6). Paths are relative to this file, with forward slashes.
# A registry change shows up in Airflow after `python -m airflow_platform.stack up` (the plugin reads it at import).
projects:
  - name: examples
    dags: {local: ../dags/examples}
  - name: governor
    dags:
      # The governor worktree (branch airflow-integration) until it is merged;
      # after the merge this becomes ../../governor/airflow/dags
      local: ../../governor-airflow/airflow/dags
      # Cloud only: documented, rendered with `render --target cloud`, not enabled locally.
      git: {repo_url: "https://github.com/aakhavan/governor", subdir: airflow/dags, tracking_ref: main}
    view: {label: Governor, url: "http://localhost:8501"}
    # Streamlit serves apps/streamlit/pages/4_Profiles.py at /Profiles; the page reads st.query_params["run_id"].
    task_link: {label: "Open report", url_template: "http://localhost:8501/Profiles?run_id={run_id_safe}", dag_prefix: "governor_"}

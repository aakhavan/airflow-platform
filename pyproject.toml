[project]
name = "airflow-platform"
version = "0.1.0"
description = "Host-side tooling and tests for a reusable self-hosted Airflow platform (no Airflow here)."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/airflow_platform"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
